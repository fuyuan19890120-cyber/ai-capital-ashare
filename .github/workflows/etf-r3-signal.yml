name: ETF-R3 每月调仓通知

on:
  schedule:
    - cron: '0 13 28 * *'
  workflow_dispatch:

jobs:
  generate-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check database
        run: ls -lh data/qmt_qfq.db && echo "DB ready"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Generate signal
        run: python r3_github_action.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
