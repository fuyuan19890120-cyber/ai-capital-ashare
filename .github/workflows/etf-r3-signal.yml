name: ETF-R3 每月调仓通知

on:
  schedule:
    - cron: '0 13 28 * *'
  workflow_dispatch:

jobs:
  generate-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Download script and database
        run: |
          curl -L -o r3_github_action.py https://raw.githubusercontent.com/fuyuan19890120-cyber/ai-capital-ashare/main/r3_github_action.py
          mkdir -p data
          curl -L -o data/qmt_qfq.db https://raw.githubusercontent.com/fuyuan19890120-cyber/ai-capital-ashare/main/data/qmt_qfq.db
          ls -lh r3_github_action.py data/qmt_qfq.db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Generate signal
        run: python r3_github_action.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
