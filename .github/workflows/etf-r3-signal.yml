name: ETF-R3 每月调仓通知
on:
  schedule:
    - cron: '0 13 28 * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          curl -fsSL -o run.py https://raw.githubusercontent.com/fuyuan19890120-cyber/ai-capital-ashare/main/r3_signal.py
          python run.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
