name: ETF-R3 每月调仓通知

on:
  schedule:
    # 每月最后一个交易日附近: 每月25-31日每个交易日13:00 UTC (北京时间21:00)
    # GitHub Actions不支持"最后交易日", 改为每月28日13:00 UTC
    - cron: '0 13 28 * *'
  workflow_dispatch:  # 手动触发

jobs:
  generate-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Generate signal
        run: python r3_github_action.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
