name: ETF-R4 增量数据

on:
  workflow_dispatch: {}
  schedule:
    # 每月 25-31 日 UTC 08:30 = 北京 16:30 (A股收盘后), 覆盖月末调仓
    - cron: '30 8 25-31 * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas akshare
      - run: python fetch_etf_r4_incremental.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf_incremental/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 ETF-R4 增量数据更新 ($(date +%Y-%m-%d))"
            git push
          fi
